name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: cli/bin/run setup
      - run: cli/bin/run verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: extension-and-test-evidence
          path: |
            artifacts/
            test-results/**/results.json
            test-results/**/screenshots/
            test-results/**/workbench.html
            test-results/**/chromedriver.log
            test-results/**/openbox.log
            test-results/**/logs/
          retention-days: 14
